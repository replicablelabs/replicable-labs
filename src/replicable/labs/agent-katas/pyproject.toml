[project]
name = "agent-katas"
version = "0.1.0"
description = "A sandbox for building an Anthropic tool-use agent (k00: card tools over the Messages API)"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pytest",
    "python-dotenv",
    "rich>=15.0.0",
]

[project.scripts]
kata = "katas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["src/katas"]
addopts = "--import-mode=importlib"

[tool.hatch.build.targets.wheel]
packages = ["src/katas"]
