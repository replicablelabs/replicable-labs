services:
  demo:
    build:
      context: ../../../..
      dockerfile: src/replicable/labs/deep-agents-langgraph-101/Dockerfile
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-openai}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_AUTH_MODE: ${OPENAI_AUTH_MODE:-api-key}
      OPENAI_OAUTH_SESSION: /run/openai-auth/session.json
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_CONFIG_FILE: ${LANGSMITH_CONTAINER_CONFIG_FILE:-/run/langsmith-profile/config.json}
      LANGSMITH_PROFILE: ${LANGSMITH_PROFILE:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-}
      LANGSMITH_AGENT_ID: ${LANGSMITH_AGENT_ID:-}
      LANGSMITH_AGENT_ENVIRONMENT: ${LANGSMITH_AGENT_ENVIRONMENT:-}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      PYTHONUNBUFFERED: "1"
    stdin_open: true
    tty: true
    volumes:
      - ./notes:/app/notes:ro

