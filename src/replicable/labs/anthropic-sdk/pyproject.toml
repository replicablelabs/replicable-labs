[project]
name = "anthropic-sdk"
version = "0.1.0"
description = "A sandbox for building an Anthropic tool-use agent (card tools over the Messages API)"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pytest",
    "python-dotenv",
    "rich>=15.0.0",
]

[project.scripts]
kata = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

# Flat layout: the code sits directly in the lab folder and installs as top-level
# modules (`cli`, `agent`, `state`, `tools`, `utils`, ...). An editable install puts
# the lab folder itself on sys.path.
[tool.hatch.build.targets.wheel]
only-include = [
    "cli.py", "style.py", "agent.py", "state.py",
    "api", "db", "handlers", "prompts", "tools", "utils",
]
dev-mode-dirs = ["."]
