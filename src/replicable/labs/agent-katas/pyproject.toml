[project]
name = "agent-katas"
version = "0.1.0"
description = "Timed drills for improving an Anthropic tool-use agent (tools, tool logic, prompting)"
requires-python = ">=3.11"
dependencies = ["anthropic", "pytest", "python-dotenv"]

[project.scripts]
kata = "katas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katas"]
