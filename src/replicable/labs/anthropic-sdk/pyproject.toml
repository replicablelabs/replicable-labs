[project]
name = "anthropic-sdk"
version = "0.1.0"
description = "A sandbox for building an Anthropic tool-use agent (k00: card tools over the Messages API)"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pytest",
    "python-dotenv",
    "rich>=15.0.0",
]

[project.scripts]
kata = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["k00"]
addopts = "--import-mode=importlib"

# Flat layout: cli.py, style.py and k00/ sit directly in the lab folder. They install
# as the top-level modules `cli`, `style` and `k00`; an editable install puts the lab
# folder itself on sys.path.
[tool.hatch.build.targets.wheel]
only-include = ["cli.py", "style.py", "k00"]
dev-mode-dirs = ["."]
